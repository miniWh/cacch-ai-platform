# ============================================================
# CACCH AI 平台 - Nginx 站点配置
# 前端静态资源 + /api 反向代理到 Gunicorn
# 部署脚本会将其安装到：
#   Debian/Ubuntu: /etc/nginx/sites-available/cacch-ai
#   Rocky/RHEL:    /etc/nginx/conf.d/cacch-ai.conf
# ============================================================

server {
    listen 80;
    server_name 10.80.85.85;

    # 前端构建产物（本地 npm run build 后上传）
    root /home/aidoc/cacch-ai-platform/frontend-dist;
    index index.html;

    # 静态资源 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（保留 /api/v1/... 原始路径）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 健康检查可直连 backend，这里不额外处理
}
